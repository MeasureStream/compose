services:
  postgres:
    image: "postgres:17"
    container_name: "postgres"
    restart: unless-stopped
    environment:
      - "POSTGRES_DB=${POSTGRES_DB}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_USER=${POSTGRES_USER}"
    ports:
      - "5432"
    networks:
      app_network:
        ipv4_address: 172.20.0.20

  settings-db:
    image: "postgres:17"
    restart: unless-stopped
    profiles: ["disabled"]
    environment:
      - "POSTGRES_DB=SETTINGS"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_USER=${POSTGRES_USER}"
    expose:
      - "5432"
    networks:
      app_network:
        ipv4_address: 172.20.0.25

  calibrator-db:
    image: "postgres:17"
    profiles: ["disabled"]
    restart: unless-stopped
    environment:
      - "POSTGRES_DB=CALIBRATOR"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_USER=${POSTGRES_USER}"
    expose:
      - "5432"
    networks:
      app_network:
        ipv4_address: 172.20.0.26

  calibrator-manager:
    image: "docker.io/christiand9699/calibrator-manager:latest"
    restart: unless-stopped
    profiles: ["disabled"]
    depends_on:
      - calibrator-db
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://calibrator-db/CALIBRATOR"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      OS: "raspberrypi"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:+UseG1GC -XX:ActiveProcessorCount=1
    networks:
      app_network:
        ipv4_address: 172.20.0.15

  sensor-manager:
    image: "docker.io/christiand9699/sensor-manager:latest"
    restart: unless-stopped
    container_name: "sensor-manager"
    depends_on:
      - postgres
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      OS: "raspberrypi"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:+UseG1GC -XX:ActiveProcessorCount=1
    volumes:
      - /home/measurestream/templates/sensor-templates:/app/templates:ro
    networks:
      app_network:
        ipv4_address: 172.20.0.10

  # Il sistema qualita': esemplari, campioni, certificati, conformita'. Stessa istanza PostgreSQL
  # di sensor-manager ma schema e utente propri, creati una volta sola con
  # metrology-service/db/setup/01_schema_e_utente.sql (METROLOGY_DB_PASSWORD va nel .env).
  metrology-service:
    image: "docker.io/christiand9699/metrology-service:latest"
    restart: unless-stopped
    container_name: "metrology-service"
    depends_on:
      - postgres
      - kafka
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: metrology
      SPRING_DATASOURCE_PASSWORD: ${METROLOGY_DB_PASSWORD}
      OS: "raspberrypi"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:+UseG1GC -XX:ActiveProcessorCount=1
      # sensor-manager risponde a chi possiede una MU: il servizio gli inoltra il token di chi
      # chiama (IP fisso di sensor-manager sulla rete del compose).
      SENSOR_MANAGER_URL: http://172.20.0.10:8080
      # La chiave di firma del laboratorio (PKCS#12) e la sua password, montate come secret.
      # Senza keystore la firma dei certificati interni non e' disponibile; per una prova si
      # puo' mettere SIGNING_DEV_SELF_SIGNED a "true" (chiave generata all'avvio, non valida
      # fuori da quel processo). Procedura: Docs/Firma_Certificati_Metrology.md
      SIGNING_KEYSTORE: /run/secrets/signing_keystore
      SIGNING_PASSWORD_FILE: /run/secrets/signing_password
      SIGNING_DEV_SELF_SIGNED: "false"
      # Le CA di cui ci si fida nella verifica dei DCC: certificati .crt/.pem/.cer.
      SIGNING_TRUST_ANCHORS: /app/trust
      # Rodaggio: l'amministratore corregge ed elimina ruoli, verifiche intermedie e numeri di
      # serie dei campioni, che in esercizio restano immutabili. Va messo a "false" prima di
      # emettere certificati veri; ogni correzione resta comunque nel registro delle azioni.
      METROLOGY_RUN_IN: "true"
    volumes:
      - /home/measurestream/metrology/trust:/app/trust:ro
    secrets:
      - signing_keystore
      - signing_password
    mem_limit: 768m
    networks:
      app_network:
        ipv4_address: 172.20.0.16
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # Il motore di taratura (pipeline Python): consuma `calibration-jobs` e pubblica su
  # `calibration-results`. Resta nel profilo «engine», quindi `docker compose up` non lo avvia:
  # prima si fa la prova di memoria, poi lo si accende con
  #   docker compose --profile engine up -d calibration-engine
  # Comandi di prova:
  #   docker compose run --rm calibration-engine calibration-engine memory-probe
  #   docker compose run --rm calibration-engine calibration-engine whoami
  # Se la prova di memoria lo sconsiglia, gira su un'altra macchina che veda Kafka e il gateway.
  # L'healthcheck e' nell'immagine: `calibration-engine health` controlla il battito del consumer.
  calibration-engine:
    image: "docker.io/christiand9699/calibration-engine:latest"
    profiles: ["engine"]
    restart: unless-stopped
    container_name: "calibration-engine"
    depends_on:
      - kafka
    environment:
      ENGINE_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ENGINE_METROLOGY_URL: http://172.20.0.200:8080
    secrets:
      - engine_client_secret
    mem_limit: 1g
    networks:
      app_network:
        ipv4_address: 172.20.0.17

  keycloak-db:
    image: "postgres:17"
    restart: unless-stopped
    container_name: "keycloak-db"
    environment:
      POSTGRES_DB: ${POSTGRES_DB_KEYCLOAK}
      POSTGRES_USER: ${POSTGRES_USER_KEYCLOAK}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_KEYCLOAK}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      app_network:
        ipv4_address: 172.20.0.21

  keycloak:
    image: keycloak/keycloak:26.4.2
    container_name: "keycloak"
    depends_on:
      - keycloak-db
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db/${POSTGRES_DB_KEYCLOAK}
      KC_DB_USERNAME: ${POSTGRES_USER_KEYCLOAK}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD_KEYCLOAK}
      KC_HTTP_COOKIE_SAMESITE: None
      KC_HTTP_COOKIE_SECURE: true

      #KC_LOG_LEVEL: DEBUG

    volumes:
      - /home/measurestream/certificates/keycloak:/etc/x509/https:ro
      - /home/measurestream/login-theme/measurestream:/opt/keycloak/themes/measurestream:ro
    ports:
      - "8443:8443"
      - "9000:9000" # espone management port
    command: >
      start
      --https-certificate-file=/etc/x509/https/cert.pem
      --https-certificate-key-file=/etc/x509/https/privkey.pem
      --hostname=auth.christiandellisanti.uk
      --hostname-strict=false
      --proxy-headers=forwarded
      --health-enabled=true

      --spi-cookie-cookie-path=/
      --spi-cookie-cookie-domain=.christiandellisanti.uk
      --spi-cookie-same-site=None
      --spi-cookie-secure=true
    #--optimized
    networks:
      app_network:
        ipv4_address: 172.20.0.22

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 1 bash -c '</dev/tcp/localhost/9000' && echo 'Port is open' || exit 1",
        ]
      interval: 15s
      retries: 15
      start_period: 60s
      timeout: 5s

  grafana:
    image: grafana/grafana-enterprise
    container_name: "grafana"
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - /var/lib/grafana/plugins
    ports:
      - 3000:3000
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.christiandellisanti.uk
      - GF_SERVER_DOMAIN=grafana.christiandellisanti.uk
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_SECURITY_ALLOW_EMBEDDING=true

      # --- ABILITA UTENTI ANONIMI COME VIEWER ---
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false # Lascia visibile il form per fare il login admin

      # (Le righe relative a GF_AUTH_GENERIC_OAUTH_* sono state rimosse o commentate)

    networks:
      app_network:
        ipv4_address: 172.20.0.30

  frontend:
    container_name: "frontend"
    image: "docker.io/christiand9699/frontend-react:latest"
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
    #environment:
    #  NODE_ENV: development
    #stdin_open: true
    #tty: true
    #command: ["npm", "run", "dev", "--", "--host"]
    networks:
      app_network:
        ipv4_address: 172.20.0.12

  gateway-iam:
    image: "docker.io/christiand9699/gateway-iam:latest"
    container_name: "gateway-iam"
    #depends_on:
    #keycloak:
    #condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_GATEWAY_CLIENT_SECRET: ${KEYCLOAK_GATEWAY_CLIENT_SECRET}
      OS: "raspberrypi"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:+UseG1GC -XX:ActiveProcessorCount=1
    #extra_hosts:
    #  - "auth.christiandellisanti.uk:172.20.0.22"
    volumes:
      - ./gateway/truststore/cacerts:/opt/java/openjdk/lib/security/cacerts
    networks:
      app_network:
        ipv4_address: 172.20.0.200
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/me"]
      interval: 10s # Ogni 10 secondi
      timeout: 5s # Timeout di 5 secondi per la risposta
      retries: 5 # Prova fino a 5 volte prima di fallire
      start_period: 120s

  kafka:
    image: bitnamilegacy/kafka:3.8.0
    hostname: kafka
    container_name: "kafka"
    restart: unless-stopped
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093

      # 1. LISTENERS (Dove Kafka apre i socket)
      # 29092 per interno Docker, 9092 per Tailscale
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:29092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:9092

      # 2. ADVERTISED LISTENERS
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,EXTERNAL://100.78.181.75:9092

      # 3. PROTOCOL MAP (Associa i nomi ai protocolli)
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_HEAP_OPTS=-Xms256m -Xmx512m
    networks:
      app_network:
        ipv4_address: 172.20.0.40

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.3.2
    container_name: kafka-connect
    restart: unless-stopped
    depends_on:
      - kafka

    environment:
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: "connect-cluster"
      CONNECT_CONFIG_STORAGE_TOPIC: "_connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "_connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "_connect-status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_LOG4J_LOGGERS: "org.reflections=ERROR,org.apache.kafka.connect.runtime.WorkerSinkTask=DEBUG,io.lenses.streamreactor.connect.mqtt=DEBUG"
      #CONNECT_LOG4J_LOGGERS: "org.reflections=ERROR"
    volumes:
      - ./connect-plugins:/usr/share/confluent-hub-components
    networks:
      app_network:
        ipv4_address: 172.20.0.41

  kafkastream:
    image: "docker.io/christiand9699/kafkastream:latest"
    container_name: "kafkastream"
    restart: unless-stopped
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_APPLICATION_NAME: kafka-stream
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:+UseG1GC -XX:ActiveProcessorCount=1
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_BROKER_URL: ${MQTT_BROKER}
      MOSQUITTO_BROKER: ${MOSQUITTO_BROKER}
      MOSQUITTO_USERNAME: ${MOSQUITTO_USERNAME}
      MOSQUITTO_PASSWORD: ${MOSQUITTO_PASSWORD}

    depends_on:
      - kafka
    networks:
      app_network:
        ipv4_address: 172.20.0.51

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    networks:
      app_network:
        ipv4_address: 172.20.0.80

  settings:
    image: "docker.io/christiand9699/settings:latest"
    restart: unless-stopped
    profiles: ["disabled"]
    expose:
      - 8080
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_CLIENT: ${MQTT_CLIENT}
      MQTT_BROKER: ${MQTT_BROKER}
      SPRING_DATASOURCE_URL: jdbc:postgresql://settings-db/SETTINGS
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:+UseG1GC -XX:ActiveProcessorCount=1
    networks:
      app_network:
        ipv4_address: 172.20.0.13

  duplicati:
    image: duplicati/duplicati:latest
    container_name: duplicati
    environment:
      - TZ=Europe/Rome
      - DUPLICATI__WEBSERVICE_PASSWORD=${DUPLICATI_PASSWORD}
      - SETTINGS_ENCRYPTION_KEY=${DUPLICATI_ENCRYPTION_KEY}
    volumes:
      - /home/measurestream/duplicati/backups:/backups
      - /home/measurestream/duplicati/config/duplicati:/config
      - grafana_data:/data/grafana
      - keycloak-db-data:/data/keycloakdb
      - kafka_data:/data/kafka
      - postgres-data:/data/postgres
    ports:
      - "8200:8200"
    restart: unless-stopped
    networks:
      app_network:
        ipv4_address: 172.20.0.60

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    profiles: ["disabled"]
    restart: unless-stopped
    ports:
      - "9443:9443" # HTTPS
      - "9002:9000" # Portainer UI su porta diversa da Keycloak
    environment:
      - ADMIN_USERNAME=${PORTAINER_ADMIN_USER}
      - ADMIN_PASSWORD=${PORTAINER_ADMIN_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      app_network:
        ipv4_address: 172.20.0.70

secrets:
  # Il secret del client Keycloak del motore (Docs/Account_Motore_Taratura_Keycloak.md).
  # Il file sta sulla macchina, con permessi 600; nel container compare in /run/secrets.
  engine_client_secret:
    file: /home/measurestream/secrets/engine_client_secret
  # La chiave di firma di metrology-service e la sua password: file della macchina, proprietario
  # UID 10002 (l'utente del container) e permessi 600. Docs/Firma_Certificati_Metrology.md
  signing_keystore:
    file: /home/measurestream/secrets/metrology-signing.p12
  signing_password:
    file: /home/measurestream/secrets/metrology-signing.password

volumes:
  postgres-data:
  keycloak-db-data:
  grafana_data:
  kafka_data:
  portainer_data:

networks:
  app_network:
    ipam:
      config:
        - subnet: 172.20.0.0/24
